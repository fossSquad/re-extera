plugins {
    id 'com.android.library' version '9.4.1'
}

import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.TaskAction
import org.gradle.process.ExecOperations

import javax.inject.Inject

// Task.exec() was removed in Gradle 9, use injected ExecOperations instead.
abstract class BuildTypescriptTask extends DefaultTask {
    @Inject
    protected abstract ExecOperations getExecOperations()

    @InputDirectory
    abstract DirectoryProperty getWorkDir()

    @TaskAction
    void build() {
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def hasPnpm = false
        try {
            def checkCmd = isWindows ? ["cmd", "/c", "where pnpm"] : ["which", "pnpm"]
            def proc = checkCmd.execute()
            proc.waitFor()
            hasPnpm = proc.exitValue() == 0
        } catch (Exception ignored) {
        }

        def packageManager = hasPnpm ? "pnpm" : "npm"
        logger.lifecycle("Using ${packageManager} to build TypeScript loader")

        getExecOperations().exec {
            workingDir = workDir.get().asFile
            if (isWindows) {
                commandLine("cmd", "/c", "${packageManager} run build")
            } else {
                commandLine(packageManager, "run", "build")
            }
        }
    }
}

def runGit(Project project, List<String> args) {
    try {
        def output = project.providers.exec {
            commandLine("git", *args)
            workingDir = project.rootDir
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return output ? output : null
    } catch (Exception e) {
        return null
    }
}

def getVersionName(Project project) {
    def envTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
    def tag = null

    if (envTag != null && !envTag.isEmpty()) {
        tag = envTag
    } else {
        tag = runGit(project, ["describe", "--tags", "--exact-match"])
    }

    if (tag != null && !tag.isEmpty()) {
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
        return tag
    }

    def date = new Date().format("yyyyMMddHHmmss")
    def commit = runGit(project, ["rev-parse", "--short", "HEAD"]) ?: "unknown"

    return "${date}-${commit}"
}

android {
    namespace 'ni.shikatu.re_extera'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 26
        
        buildConfigField "String", "RE_EXTERA_VERSION", "\"${getVersionName(project)}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register("aarToDex", Exec) {
    dependsOn "assembleRelease"
    group = "build"
    description = "Собирает DEX из AAR модуля"

    // Task.project at execution time is deprecated: capture everything at configuration time.
    def rootDir = project.rootDir
    def projBuildDir = project.layout.buildDirectory.get().asFile
    def projName = project.name
    def compileClasspath = configurations.named("releaseCompileClasspath")

    doFirst {
        def aarPath = new File(projBuildDir, "outputs/aar/${projName}-release.aar")
        def dexOut = new File(projBuildDir, "dex/")
        mkdir dexOut

        // android.sdkDirectory was removed from the AGP DSL, resolve like AGP does:
        // local.properties sdk.dir -> ANDROID_HOME -> ANDROID_SDK_ROOT
        def sdkDir = null
        def localProps = new File(rootDir, "local.properties")
        if (localProps.exists()) {
            def props = new Properties()
            localProps.withInputStream { props.load(it) }
            sdkDir = props.getProperty("sdk.dir")
        }
        if (!sdkDir) {
            sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        }
        if (!sdkDir) {
            throw new GradleException("Android SDK not found: set sdk.dir in local.properties or ANDROID_HOME")
        }

        def libArgs = ["--lib", "${sdkDir}/platforms/android-35/android.jar"]
        compileClasspath.get().files.each { f ->
            if (f.name.endsWith(".jar")) {
                libArgs += ["--lib", f.absolutePath]
            }
        }

        commandLine "${sdkDir}/build-tools/36.0.0/d8",
                aarPath,
                *libArgs,
                "--output", dexOut
    }
}


tasks.register("buildDex") {

    group = "build"
    description = "Собирает модуль и конвертирует его в DEX"
    dependsOn "assembleRelease", "aarToDex"
}

tasks.register("buildPluginPython", Exec) {
    group = "build"
    description = "Builds Python loader plugin for exteraGram"
    commandLine "python3", "loader/python/build.py"
}

tasks.register("buildPluginTypescript", BuildTypescriptTask) {
    group = "build"
    description = "Builds TypeScript loader plugin for Inugram"
    workDir.set(project.layout.projectDirectory.dir("loader/typescript"))
}

tasks.register("buildPlugin") {
    group = "build"
    description = "Builds loader plugins (specify -Ptarget=python or -Ptarget=typescript to build only one)"

    def target = project.findProperty("target") ?: project.findProperty("plugin") ?: "all"
    if (target == "python") {
        dependsOn "buildPluginPython"
    } else if (target == "typescript" || target == "ts") {
        dependsOn "buildPluginTypescript"
    } else {
        dependsOn "buildPluginPython", "buildPluginTypescript"
    }
}

repositories {
    mavenCentral()
    google()
    maven { url = 'https://maven.aliucord.com/snapshots' }
}
dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.aliucord:Aliuhook:1.1.3'
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    compileOnly 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

