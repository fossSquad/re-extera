plugins {
    id 'com.android.library' version '8.2.2'
}

// Single source of truth for the plugin version: loader/metadata.py __version__.
// The DEX (Main.VERSION) reads the SAME value so the loader and the DEX never drift.
def getLoaderVersion(Project project) {
    def metaFile = new File(project.rootDir, "loader/metadata.py")
    if (metaFile.exists()) {
        def m = (metaFile.text =~ /__version__\s*=\s*["']([^"']+)["']/)
        if (m.find()) {
            return m.group(1)
        }
    }
    return "0.0.0"
}

def getVersionName(Project project) {
    def envTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
    def tag = null

    if (envTag != null && !envTag.isEmpty()) {
        tag = envTag
    } else {
        try {
            def process = "git describe --tags --exact-match".execute(null, project.rootDir)
            process.waitFor()
            if (process.exitValue() == 0) {
                tag = process.text.trim()
            }
        } catch (Exception e) {}
    }

    if (tag != null && !tag.isEmpty()) {
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
        return tag
    }

    // No release tag: use the loader's declared version so DEX == loader/metadata.py.
    return getLoaderVersion(project)
}

android {
    namespace 'ni.shikatu.re_extera'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 26
        
        buildConfigField "String", "RE_EXTERA_VERSION", "\"${getVersionName(project)}\""

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register("aarToDex", Exec) {
    dependsOn "assembleRelease"
    group = "build"
    description = "Собирает DEX из AAR модуля"

    doFirst {
        def aarPath = "$buildDir/outputs/aar/${project.name}-release.aar"
        def dexOut = "$buildDir/dex/"
        mkdir dexOut

        commandLine "${android.sdkDirectory}/build-tools/36.0.0/d8",
                aarPath,
                "--output", dexOut
    }
}


tasks.register("buildDex") {

    group = "build"
    description = "Собирает модуль и конвертирует его в DEX"
    dependsOn "assembleRelease", "aarToDex"
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://maven.aliucord.com/snapshots' }
}
dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.aliucord:Aliuhook:1.1.3'
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    compileOnly 'com.google.android.material:material:1.13.0'
}

