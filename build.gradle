plugins {
    id 'com.android.library' version '8.2.2'
}

def getVersionName(Project project) {
    def envTag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
    def tag = null
    
    if (envTag != null && !envTag.isEmpty()) {
        tag = envTag
    } else {
        try {
            def process = "git describe --tags --exact-match".execute(null, project.rootDir)
            process.waitFor()
            if (process.exitValue() == 0) {
                tag = process.text.trim()
            }
        } catch (Exception e) {}
    }
    
    if (tag != null && !tag.isEmpty()) {
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
        return tag
    }

    def date = new Date().format("yyyyMMddHHmmss")
    def commit = "unknown"
    try {
        def process = "git rev-parse --short HEAD".execute(null, project.rootDir)
        process.waitFor()
        if (process.exitValue() == 0) {
            commit = process.text.trim()
        }
    } catch (Exception e) {}

    return "${date}-${commit}"
}

android {
    namespace 'ni.shikatu.re_extera'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 26
        
        buildConfigField "String", "RE_EXTERA_VERSION", "\"${getVersionName(project)}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register("aarToDex", Exec) {
    dependsOn "assembleRelease"
    group = "build"
    description = "Собирает DEX из AAR модуля"

    doFirst {
        def aarPath = "$buildDir/outputs/aar/${project.name}-release.aar"
        def dexOut = "$buildDir/dex/"
        mkdir dexOut

        commandLine "${android.sdkDirectory}/build-tools/36.0.0/d8",
                aarPath,
                "--output", dexOut
    }
}


tasks.register("buildDex") {
    group = "build"
    description = "Собирает модуль и конвертирует его в DEX"
    dependsOn "assembleRelease", "aarToDex"
}

tasks.register("buildPlugin", Exec) {
    group = "build"
    description = "Собирает Python плагин в .elyx архив"
    
    workingDir = file("loader")
    
    commandLine "bash", "-c", """
        set -e
        if [ ! -f ".venv/bin/activate" ] || ! .venv/bin/python3 -c "import pip" &> /dev/null; then
            rm -r .venv || true
            python3 -m venv .venv
            if ! .venv/bin/python3 -c "import pip" &> /dev/null; then
                curl -sS https://bootstrap.pypa.io/get-pip.py | .venv/bin/python3
            fi
        fi
        source .venv/bin/activate
        pip install -r requirements.txt
        elyb build -nf
        mkdir -p ../build/plugin
        cp builds/loader.elyx ../build/plugin/loader.elyx
    """
}

tasks.register("buildAll") {
    group = "build"
    description = "Собирает и DEX, и Elyx плагин"
    dependsOn "buildDex", "buildPlugin"
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://maven.aliucord.com/snapshots' }
}
dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.aliucord:Aliuhook:1.1.3'
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    compileOnly 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

