pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 're-extera'

def telegramSettings = file('libs/Telegram/settings.gradle')
if (telegramSettings.exists()) {
    includeBuild('libs/Telegram') {
        dependencySubstitution {
            substitute module('org.telegram:TMessagesProj') using project(':TMessagesProj')
        }
    }
} else {
    logger.warn("'libs/Telegram' is not initialized. Run 'git submodule update --init --recursive --depth=1'.")
}
