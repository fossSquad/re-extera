name: Build Dex and Plugins

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Install loader/typescript dependencies
      run: |
        cd loader/typescript
        pnpm install --no-frozen-lockfile

    - name: Build with Gradle
      run: |
        ./gradlew buildDex
        ./gradlew buildPlugin

    - name: Copy build artifacts to root
      run: |
        cp build/dex/classes.dex .
        cp build/plugin/loader.plugin .
        cp build/plugin/loader.inu.js .

    - name: Upload Dev artifacts
      uses: actions/upload-artifact@v7
      with:
        name: re-extera-dev
        path: |
          classes.dex
          loader.plugin
          loader.inu.js

    - name: Parse tag for release name
      id: parse_tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        WITHOUT_V=${TAG_NAME#v}
        PLUGIN_VER=${WITHOUT_V%-*}
        TG_VER=${WITHOUT_V#*-}
        echo "plugin=$PLUGIN_VER" >> $GITHUB_OUTPUT
        echo "tg=$TG_VER" >> $GITHUB_OUTPUT

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        name: v${{ steps.parse_tag.outputs.plugin }} for ${{ steps.parse_tag.outputs.tg }}
        files: |
          classes.dex
          loader.plugin
          loader.inu.js
        generate_release_notes: true
